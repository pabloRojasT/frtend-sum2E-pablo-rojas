<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Turno - SaludPlus</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .turnos-section {
            padding: 80px 20px;
            background-color: var(--light-bg);
            min-height: calc(100vh - 100px);
        }

        .turnos-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--white);
            padding: 40px;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(0, 102, 204, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #0052a3;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>SaludPlus</h1>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html#inicio">Inicio</a></li>
                    <li><a href="index.html#especialidades">Especialidades</a></li>
                    <li><a href="index.html#medicos">Médicos</a></li>
                    <li><a href="index.html#obras-sociales">Obras Sociales</a></li>
                    <li><a href="index.html#contacto">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- SECCIÓN DE TURNOS -->
    <section class="turnos-section">
        <div class="turnos-container">
            <a href="index.html" class="back-link">← Volver</a>
            
            <h2 class="section-title">Solicitar Turno</h2>
            <p class="section-subtitle">Completa el formulario para solicitar tu turno médico</p>

            <form>
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono *</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>

                <div class="form-group">
                    <label for="especialidad">Especialidad *</label>
                    <select id="especialidad" name="especialidad" required>
                        <option value="">Selecciona una especialidad</option>
                        <option value="clinica-general">Clínica General</option>
                        <option value="cardiologia">Cardiología</option>
                        <option value="pediatria">Pediatría</option>
                        <option value="ginecologia">Ginecología</option>
                        <option value="traumatologia">Traumatología</option>
                        <option value="neurologia">Neurología</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha Preferida *</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="form-group">
                    <label for="obra-social">Obra Social</label>
                    <select id="obra-social" name="obra-social">
                        <option value="">Sin cobertura</option>
                        <option value="osde">OSDE</option>
                        <option value="swiss-medical">Swiss Medical</option>
                        <option value="galeno">Galeno</option>
                        <option value="ioma">IOMA</option>
                        <option value="medicus">Medicus</option>
                        <option value="sancor">Sancor Salud</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="consulta">Motivo de la Consulta</label>
                    <textarea id="consulta" name="consulta" placeholder="Describe brevemente tu consulta o síntomas"></textarea>
                </div>

                <button type="submit" class="btn-submit">Solicitar Turno</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 SaludPlus - Clínica Médica. Todos los derechos reservados.</p>
            <p>Diseño y desarrollo por: <strong>Pablo Rojas</strong></p>
        </div>
    </footer>
</body>
</html>
